<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandartspraktijk - Maak Afspraak</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-50 font-sans text-gray-800 min-h-screen p-6">

    <main class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-xl border-t-4 border-teal-500 mt-10">
        <h1 class="text-4xl font-bold text-gray-900 mb-2">Tandartspraktijk De Glimlach</h1>
        <p class="text-lg text-gray-600 mb-8">Maak online een afspraak. Deze wordt direct in ons systeem (Google Sheets) gezet.</p>
        
        <form id="aanvraagFormulier" onsubmit="verstuurNaarGoogleSheets(event)" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Naam Patiënt</label>
                    <input type="text" id="veld-naam" required class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Telefoonnummer</label>
                    <input type="tel" id="veld-telefoon" required class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Behandeling</label>
                    <select id="veld-behandeling" required class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                        <option value="" disabled selected>Kies...</option>
                        <option value="Controle">Controle</option>
                        <option value="Spoed">Spoed / Kiespijn</option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Datum</label>
                    <input type="date" id="veld-datum" required class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tijdstip</label>
                    <input type="time" id="veld-tijd" required class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
            </div>

            <div id="status-bericht" class="hidden font-bold p-3 rounded mt-4"></div>

            <button type="submit" id="verzend-knop" class="w-full bg-teal-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-teal-700 transition mt-4">
                Verstuur naar Backend (Sheets)
            </button>
        </form>
    </main>

    <script>
        // BELANGRIJK: Plak hier de URL die je van Google Apps Script krijgt!
        const GOOGLE_SCRIPT_URL = "PLAK_HIER_JE_GOOGLE_SCRIPT_URL";

        function verstuurNaarGoogleSheets(event) {
            event.preventDefault();
            
            const knop = document.getElementById('verzend-knop');
            const status = document.getElementById('status-bericht');
            
            knop.innerText = "Bezig met verzenden...";
            knop.disabled = true;

            // Verzamel data
            const data = {
                naam: document.getElementById('veld-naam').value,
                telefoon: document.getElementById('veld-telefoon').value,
                behandeling: document.getElementById('veld-behandeling').value,
                datum: document.getElementById('veld-datum').value,
                tijd: document.getElementById('veld-tijd').value
            };

            // Stuur naar Google Sheets
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => {
                status.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                status.classList.add('bg-green-100', 'text-green-700');
                status.innerText = "Gelukt! De afspraak staat in de Google Sheets database.";
                document.getElementById('aanvraagFormulier').reset();
                knop.innerText = "Verstuur naar Backend (Sheets)";
                knop.disabled = false;
            })
            .catch(error => {
                status.classList.remove('hidden');
                status.classList.add('bg-red-100', 'text-red-700');
                status.innerText = "Fout bij verzenden. Heb je de Google Script URL goed ingevuld?";
                knop.innerText = "Verstuur naar Backend (Sheets)";
                knop.disabled = false;
            });
        }
    </script>
</body>
</html>
